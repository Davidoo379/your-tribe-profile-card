<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDND Visitekaartje</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <header>
      <h1 class="hidden">David Jak</h1>
      <nav class="stage">
        <button>Hobby's</button>
        <button>Ambitions</button>
        <button>Profile</button>
        <button>Educations</button>
        <button>Skills</button>
      </nav>
    </header>
    
    <article class="profile-page">
      <header>
        <h2>David Jak</h2>
      </header>
      <section class="information-card">
        <h3>Information</h3>
        <ul>
          <li>Nationaliteit: Nederlands</li>
          <li>Woonplaats: Wormer</li>
          <li>Leeftijd: 25</li>
        </ul>
      </section>
      <section class="qoute-card">
        <h3>Qoute:</h3>
        <p><cite>"Is the juice worth the Sqeeze?"</cite></p>
      </section>
    </article>

    <aside class="background-img" >
      <img src="assets/creative-coder.png" alt="" width="1615" height="2333">
    </aside>

    <script src="scripts/script.js"></script>
    
  </body>
</html>
